<!-- Canvas Component - Orchestrator -->
<!-- Delegates rendering to the active layout component -->

<ng-container [ngSwitch]="activeLayout">
  
  <!-- Default Layout (Edit Mode) -->
  <app-default-layout 
    *ngSwitchCase="'default'"
    [state]="state"
    [contentTypes]="contentTypes"
    [userText]="userText"
    [sourceUrl]="sourceUrl"
    [nodeId]="nodeId"
    [inputMode]="inputModeValue"
    [backgroundColor]="backgroundColor"
    [columns]="effectiveColumns"
    [flatGroups]="_flatGroups"
    [showInputArea]="effectiveShowInputArea"
    [showStatusBar]="effectiveShowStatusBar"
    [showCoreFields]="effectiveShowCoreFields"
    [showSpecialFields]="effectiveShowSpecialFields"
    [showFooter]="effectiveShowFooter"
    [showFloatingControls]="effectiveShowFloatingControls"
    [showFieldActions]="effectiveShowFieldActions"
    [showContentTypeOnly]="_showContentTypeOnly"
    [showUploadButton]="effectiveShowUploadButton"
    [showSaveButton]="effectiveShowSaveButton"
    [showJsonLoader]="effectiveShowJsonLoader"
    [showLanguageSwitcher]="effectiveShowLanguageSwitcher"
    [showContentType]="effectiveShowContentType"
    [showResetButton]="effectiveShowResetButton"
    [readonly]="effectiveReadonly"
    [highlightAi]="_highlightAi"
    [showPreview]="_showPreview"
    [screenshotEnabled]="state?.screenshotEnabled ?? true"
    (userTextChange)="userText = $event"
    (sourceUrlChange)="sourceUrl = $event"
    (nodeIdChange)="nodeId = $event"
    (startExtraction)="startExtraction()"
    (startUrlExtraction)="startUrlExtraction($event)"
    (startNodeIdExtraction)="startNodeIdExtraction($event)"
    (inputModeChange)="_inputMode = $event"
    (reset)="reset()"
    (selectContentType)="selectContentType($event)"
    (fieldValueChange)="canvas.updateFieldValue($event.fieldId, $event.value)"
    (jsonLoaded)="onJsonLoaded($event)"
    (downloadJson)="downloadJson()"
    (submit)="submit()"
    (upload)="uploadToRepository()"
    (dismissError)="canvas.clearError()"
    (screenshotToggle)="canvas.setScreenshotEnabled($event)">
  </app-default-layout>
  
  <!-- Plugin Layout (Compact sidebar for browser extension) -->
  <app-plugin-layout 
    *ngSwitchCase="'plugin'"
    [state]="state"
    [contentTypes]="contentTypes"
    [userText]="userText"
    [sourceUrl]="sourceUrl"
    [nodeId]="nodeId"
    [inputMode]="inputModeValue"
    [backgroundColor]="backgroundColor"
    [columns]="effectiveColumns"
    [flatGroups]="_flatGroups"
    [showInputArea]="effectiveShowInputArea"
    [showStatusBar]="effectiveShowStatusBar"
    [showCoreFields]="effectiveShowCoreFields"
    [showSpecialFields]="effectiveShowSpecialFields"
    [showFieldActions]="effectiveShowFieldActions"
    [showFloatingControls]="effectiveShowFloatingControls"
    [showContentTypeOnly]="_showContentTypeOnly"
    [showUploadButton]="effectiveShowUploadButton"
    [showSaveButton]="effectiveShowSaveButton"
    [showLanguageSwitcher]="effectiveShowLanguageSwitcher"
    [showContentType]="effectiveShowContentType"
    [showResetButton]="effectiveShowResetButton"
    [showPageMode]="_showPageMode"
    [readonly]="effectiveReadonly"
    [highlightAi]="_highlightAi"
    [showPreview]="_showPreview"
    [screenshotEnabled]="state?.screenshotEnabled ?? true"
    (userTextChange)="userText = $event"
    (sourceUrlChange)="sourceUrl = $event"
    (nodeIdChange)="nodeId = $event"
    (startExtraction)="startExtraction()"
    (startUrlExtraction)="startUrlExtraction($event)"
    (startNodeIdExtraction)="startNodeIdExtraction($event)"
    (inputModeChange)="_inputMode = $event"
    (reset)="reset()"
    (reloadFromPage)="reloadFromPage.emit()"
    (selectContentType)="selectContentType($event)"
    (fieldValueChange)="canvas.updateFieldValue($event.fieldId, $event.value)"
    (submit)="submit()"
    (upload)="uploadToRepository()"
    (screenshotToggle)="canvas.setScreenshotEnabled($event)">
  </app-plugin-layout>

    *ngSwitchCase="'dialog'"

    [contentTypes]="contentTypes"
    [backgroundColor]="backgroundColor"

    [flatGroups]="_flatGroups"

    [showSaveButton]="effectiveShowSaveButton"
    [showLanguageSwitcher]="effectiveShowLanguageSwitcher"

    [showPreview]="_showPreview"
    [screenshotEnabled]="state?.screenshotEnabled ?? true"
    (userTextChange)="userText = $event"

    [readonly]="effectiveReadonly"
    [highlightAi]="_highlightAi"
    [showPreview]="_showPreview"
