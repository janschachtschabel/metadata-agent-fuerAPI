<!-- Prüftisch Org Layout Template -->
<!-- edu-sharing organizational review table with gray group headers -->

<div class="layout-container layout-prueftisch-org" [style.background]="backgroundColor || '#ffffff'">

  <!-- ===== INPUT AREA (optional) ===== -->
  <app-input-area
    *ngIf="showInputArea"
    [userText]="userText"
    [sourceUrl]="sourceUrl"
    [nodeId]="nodeId"
    [inputMode]="inputMode"
    [isExtracting]="state?.isExtracting ?? false"
    (userTextChange)="userTextChange.emit($event)"
    (sourceUrlChange)="sourceUrlChange.emit($event)"
    (nodeIdChange)="nodeIdChange.emit($event)"
    (startExtraction)="startExtraction.emit()"
    (startUrlExtraction)="startUrlExtraction.emit($event)"
    (startNodeIdExtraction)="startNodeIdExtraction.emit($event)"
    (inputModeChange)="inputModeChange.emit($event)"
    (reset)="reset.emit()"
    [screenshotEnabled]="screenshotEnabled"
    (screenshotToggle)="screenshotToggle.emit($event)">
  </app-input-area>

  <!-- ===== STATUS BAR (optional) ===== -->
  <app-status-bar
    *ngIf="showStatusBar && state?.totalFields"
    [state]="state"
    [contentTypes]="contentTypes"
    (selectContentType)="selectContentType.emit($event)">
  </app-status-bar>

  <!-- ===== PREVIEW THUMBNAIL ===== -->
  <app-preview-thumbnail
    *ngIf="showPreview && state?.previewImageUrl"
    [imageUrl]="state!.previewImageUrl">
  </app-preview-thumbnail>

  <!-- ===== FIELD GROUPS ===== -->
  <section class="fields-section" *ngIf="_displayGroups.length">
    <ng-container *ngFor="let group of _displayGroups; trackBy: trackByGroupId">
      <div class="field-group" 
           *ngIf="(flatGroups || (group.isCore && showCoreFields) || (!group.isCore && showSpecialFields)) && (!readonly || (_visibleFieldsMap.get(group.id)?.length ?? 0) > 0)">
        
        <!-- Group Header: light gray bar with icon and uppercase label -->
        <div class="group-header">
          <mat-icon class="group-icon">{{ group.icon || getGroupIcon(group) }}</mat-icon>
          <h3>{{ group.label | uppercase }}</h3>
        </div>
        
        <!-- Fields -->
        <div class="group-fields"
             [class.columns-2]="columns === 2"
             [class.columns-3]="columns === 3"
             [class.columns-4]="columns === 4">
          <app-field
            *ngFor="let field of _visibleFieldsMap.get(group.id); trackBy: trackByFieldId"
            [field]="field"
            [readonly]="readonly"
            [showActions]="showFieldActions"
            [highlightAi]="highlightAi"
            (valueChange)="fieldValueChange.emit({ fieldId: field.fieldId, value: $event })">
          </app-field>
        </div>
      </div>
    </ng-container>
  </section>

  <!-- ===== EMPTY STATE ===== -->
  <section class="empty-state" *ngIf="!state?.fieldGroups?.length && !state?.isExtracting">
    <mat-icon>info_outline</mat-icon>
    <p>{{ 'EMPTY_STATE.NO_DATA' | translate }}</p>
  </section>

  <!-- ===== FLOATING CONTROLS ===== -->
  <div class="floating-controls" *ngIf="showFloatingControls">
    <div class="floating-content-type" *ngIf="showContentType">
      <div class="split-button">
        <div class="split-button-label">
          <mat-icon>{{ state?.contentTypeIcon || 'category' }}</mat-icon>
          <span>{{ state?.contentTypeLabel || ('CONTENT_TYPE.SELECT' | translate) }}</span>
        </div>
        <button 
          mat-icon-button
          [matMenuTriggerFor]="floatingCtMenu">
          <mat-icon>expand_more</mat-icon>
        </button>
      </div>
      
      <mat-menu #floatingCtMenu="matMenu">
        <button 
          mat-menu-item 
          *ngFor="let ct of contentTypes"
          (click)="selectContentType.emit(ct)"
          [class.active]="state?.contentTypeLabel === ct.label">
          <span>{{ ct.label }}</span>
        </button>
      </mat-menu>
    </div>
    
    <!-- Language Switcher -->
    <app-language-switcher *ngIf="showLanguageSwitcher && !showContentTypeOnly"></app-language-switcher>
  </div>

</div>
